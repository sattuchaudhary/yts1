services:
  - type: web
    name: youtube-stream-manager
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-stream-db
          property: connectionString
      - key: YOUTUBE_STREAM_KEY
        sync: false  # This will be set manually in Render dashboard
    buildFilter:
      paths:
        - client/**
        - server/**
        - shared/**
        - package.json
        - vite.config.ts
    disk:
      name: uploads
      mountPath: /uploads
      sizeGB: 1
    waitForDatabase: true  # Ensures the web service waits for database to be ready

databases:
  - name: youtube-stream-db
    databaseName: youtube_stream
    plan: free
    ipAllowList: []  # All IPs are allowed
    postDeploy:  # Run migrations after database creation
      - npx drizzle-kit push:pg
